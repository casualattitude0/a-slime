<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Chat</title>
  <style>
    :root {
      --bg: #1a1b1e;
      --surface: #25262b;
      --text: #e9e9ef;
      --muted: #909296;
      --accent: #4dabf7;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      max-width: 52rem;
      margin-inline: auto;
      padding: 1rem;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 0 0 1rem;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #373a40;
      border-radius: 8px;
      padding: 0.75rem;
      background: var(--surface);
      margin-bottom: 0.75rem;
      min-height: 280px;
    }
    .msg {
      margin-bottom: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { color: var(--accent); }
    .msg.bot { color: var(--text); }
    .msg.err { color: var(--error); font-size: 0.875rem; }
    form {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      min-height: 3rem;
      max-height: 10rem;
      resize: vertical;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: 1px solid #373a40;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      font: inherit;
      cursor: pointer;
      background: var(--accent);
      color: #111;
      font-weight: 600;
    }
    button.secondary {
      background: #495057;
      color: var(--text);
      font-weight: 500;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .toolbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Local agent</h1>
  <div class="toolbar">
    <button type="button" class="secondary" id="clear">Clear history</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <textarea id="input" placeholder="Message…" rows="2" autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <script>
    const KEY = "agent_session_id";
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const form = document.getElementById("f");
    const sendBtn = document.getElementById("send");

    function getSessionId() {
      return localStorage.getItem(KEY);
    }
    function setSessionId(id) {
      if (id) localStorage.setItem(KEY, id);
      else localStorage.removeItem(KEY);
    }

    function appendLine(role, text, className) {
      const div = document.createElement("div");
      div.className = "msg " + (className || role);
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function sendMessage(ev) {
      ev.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendLine("user", message, "user");
      input.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            session_id: getSessionId(),
          }),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const d = data.detail;
          const errText = Array.isArray(d)
            ? d.map((x) => x.msg || JSON.stringify(x)).join("; ")
            : (d || res.statusText || "Request failed");
          appendLine("err", errText, "err");
          return;
        }

        if (data.session_id) setSessionId(data.session_id);

        if (data.error) {
          appendLine("err", data.error, "err");
        }
        if (data.reply) {
          appendLine("bot", data.reply, "bot");
        }
      } catch (e) {
        appendLine("err", String(e), "err");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    async function clearHistory() {
      const sid = getSessionId();
      sendBtn.disabled = true;
      try {
        await fetch("/api/clear", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sid }),
        });
        log.innerHTML = "";
      } catch (e) {
        appendLine("err", String(e), "err");
      } finally {
        sendBtn.disabled = false;
      }
    }

    form.addEventListener("submit", sendMessage);
    document.getElementById("clear").addEventListener("click", clearHistory);
  </script>
</body>
</html>
